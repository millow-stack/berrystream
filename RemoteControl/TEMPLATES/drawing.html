<head>
<meta charset="utf-8" />
<title>Whiteboard</title>
<script type="text/JavaScript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.4.2/jquery.min.js?ver=1.4.2"></script>
<style>
	* {
		margin: 0;
		overscroll-behavior: none;
		padding: 0;
	}

	body, html {
		height: 100%;
	}

	div {
		width: 100%;
		text-align: center;
		padding: 8px;
		background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAMklEQVR4AWTKwQkAMAgEQU1/6Sk9WaC5fQiiwj4c7ti+nJjaeMcHKCtkAUYh4DzqqvgAAAD);
	}

	button {
		padding: 8px;
		width: 45%;
		height: 50px;
	}

	#board {
		cursor: crosshair;
	    position: fixed;
	    border-top: 5px double #aa0000;
	    background: url(
data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAkAAAAJCAYAAADgkQYQAAAAPElEQVR4AayOwQ0AMAgCTVfqHE7rHN2p8CO08aWRB+QSWPFeevSDnIlZiBtUG33qk3WFUHXMFyFk/c9BFwAA///FzULXAAAABklEQVQDAE0mCWB/rAvNAAAAAElFTkSuQmCC
   ) repeat, #fdfbe1;
	}
</style>
</head>
<body>
	<div>
		<button id="clear">Clear</button>
		<button id="send">Send</button>
		<br/>
		<input type="color" id="pencl"/>
		<input type="file" id="imgLoader" accept="image/*" capture>
	</div>
	<canvas id="board"></canvas>
	<script>
		window.onload = function() {
		var board = document.getElementById("board");
		var ctx = board.getContext("2d");
	    
	    document.getElementById("imgLoader").addEventListener("change", function(e) {
		    const file = e.target.files[0];
		    const reader = new FileReader();

		    reader.onload = function(event) {
		        const img = new Image();
		        img.onload = function() {
		            // Draw image to fit canvas
		            ctx.drawImage(img, 0, 0, board.width, board.height);
		        }
		        img.src = event.target.result;
		    };

		    if (file) reader.readAsDataURL(file);
		});

	    document.querySelector("#clear").addEventListener("click", (e)=>{
	    	ctx.clearRect(0, 0, board.width, board.height);
	    })
	    
	    document.querySelector("#send").addEventListener("click", (e)=>{
			var data = JSON.stringify({uri: board.toDataURL("image/png")});
			var xhr = new XMLHttpRequest();
            xhr.open('POST', '/drawing', true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
            xhr.send(data);
        })

	    board.width = window.innerWidth;
		board.height = window.innerHeight;
		
		
	    ctx.fillStyle="transparent";
	    ctx.fillRect(0,0,board.width,board.height);
		
	    
		if(board){
			var isDown = false;
			var canvasX, canvasY;
			ctx.lineWidth = 5;
			
			$(board)
			.mousedown(function(e){
				isDown = true;
				ctx.beginPath();
				canvasX = e.pageX - board.offsetLeft;
				canvasY = e.pageY - board.offsetTop;
				ctx.moveTo(canvasX, canvasY);
			})
			.mousemove(function(e){
				if(isDown !== false) {
					canvasX = e.pageX - board.offsetLeft;
					canvasY = e.pageY - board.offsetTop;
					ctx.lineTo(canvasX, canvasY);
					ctx.strokeStyle = document.querySelector("#pencl").value;
					ctx.stroke();
				}
			})
			.mouseup(function(e){
				isDown = false;
				ctx.closePath();
			});
		}
		
		
		draw = {
			started: false,
			start: function(evt) {

				ctx.beginPath();
				ctx.moveTo(
					evt.touches[0].pageX,
					evt.touches[0].pageY
				);

				this.started = true;

			},
			move: function(evt) {

				if (this.started) {
					ctx.lineTo(
						evt.touches[0].pageX,
						evt.touches[0].pageY
					);

					ctx.strokeStyle = document.querySelector("#pencl").value;
					ctx.lineWidth = 5;
					ctx.stroke();
				}

			},
			end: function(evt) {
				this.started = false;
			}
		};
		
		
		board.addEventListener('touchstart', draw.start, false);
		board.addEventListener('touchend', draw.end, false);
		board.addEventListener('touchmove', draw.move, false);
		
		
		document.body.addEventListener('touchmove',function(evt){
			evt.preventDefault();
		},false);
	};
	</script>
</body>
</html>
