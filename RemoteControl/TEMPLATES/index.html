<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Pad</title>
    <style>
        *{
            outline:none;
            padding: 0px;
            border: 0px;
            margin: 0px;
            height: 100%;
            width: 100%;
             background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAYAAACNbyblAAAAMklEQVR4AWTKwQkAMAgEQU1/6Sk9WaC5fQiiwj4c7ti+nJjaeMcHKCtkAUYh4DzqqvgAAAD//yRLU8MAAAAGSURBVAMAC4AGvWPcn1gAAAAASUVORK5CYII=) repeat;
        }
        #videoStream {
            position: absolte;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
            background: black;
/*            z-index: -1; /* Place the video stream behind other elements */*/
        }
    </style>
</head>
<body>
    <img id="videoStream" src="/vidfeed" alt="Video Stream"/>
    <script>
        function getOS() {
            const userAgent = window.navigator.userAgent;
            const platform = window.navigator.platform;
            const macosPlatforms = ['Macintosh', 'MacIntel', 'MacPPC', 'Mac68K'];
            const windowsPlatforms = ['Win32', 'Win64', 'Windows', 'WinCE'];
            const iosPlatforms = ['iPhone', 'iPad', 'iPod'];
            let os = null;

            if (macosPlatforms.indexOf(platform) !== -1) {
                os = 'Mac OS';
            } else if (iosPlatforms.indexOf(platform) !== -1) {
                os = 'iOS';
            } else if (windowsPlatforms.indexOf(platform) !== -1) {
                os = 'Windows';
            } else if (/Android/.test(userAgent)) {
                os = 'Android';
            } else if (!os && /Linux/.test(platform)) {
                os = 'Linux';
            }

            return os;
        }
        document.addEventListener("DOMContentLoaded", function() {
            var image = document.querySelector('#videoStream')
            if (image.requestFullscreen) {
                image.requestFullscreen();
            } else if (image.webkitRequestFullscreen) { /* Safari */
                image.webkitRequestFullscreen();
            } else if (image.webkitRequestFullscreen) { /* IE11 */
                image.webkitRequestFullscreen();
            } else if (image.msRequestFullscreen) { /* IE11 */
                image.msRequestFullscreen();
            }
            // alert(/iPhone|Android.+Mobile|Windows Phone/i.test(navigator.userAgent) && window.matchMedia("(max-width: 767px)").matches)
            if (getOS() == 'Android'){
                let startX = 0;
                let startY = 0;

                window.addEventListener("touchstart", (event) => {
                    event.preventDefault();
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', '/click?act=left', true);
                    xhr.send();
                    startX = event.touches[0].clientX;
                    startY = event.touches[0].clientY;
                });

                image.addEventListener('mousemove', function(event) {
                    event.preventDefault();
                    // var x = event.clientX/window.innerWidth;
                    // var y = event.clientY/window.innerHeight;
                    var rect = image.getBoundingClientRect();
                    var x = (event.clientX-rect.left)/image.offsetWidth;
                    var y = (event.clientY-rect.top)/image.offsetHeight;
                    var fixture = 0;

                    // Prepare the data to be sent
                    var data = JSON.stringify({ x: x+fixture, y: y+fixture});

                    // Create a new XMLHttpRequest object
                    var xhr = new XMLHttpRequest();

                    // Configure it: POST-request for the URL /log_coordinates
                    xhr.open('POST', '/click?act=left', true);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                    // Send the request with the data
                    xhr.send(data);
                });
                image.addEventListener('contextmenu', function(event) {
                    event.preventDefault();
                    // var x = event.clientX/window.innerWidth;
                    // var y = event.clientY/window.innerHeight;
                    var rect = image.getBoundingClientRect();
                    var x = (event.clientX-rect.left)/image.offsetWidth;
                    var y = (event.clientY-rect.top)/image.offsetHeight;
                    var fixture = 0;

                    // Prepare the data to be sent
                    var data = JSON.stringify({ x: x+fixture, y: y+fixture});

                    // Create a new XMLHttpRequest object
                    var xhr = new XMLHttpRequest();

                    // Configure it: POST-request for the URL /log_coordinates
                    xhr.open('POST', '/click?act=right', true);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                    // Send the request with the data
                    xhr.send(data);
                });
                window.addEventListener('touchmove', function(event) {
                    event.preventDefault();
                    if (event.touches.length === 1) {
                        // var temp = temp || 0;
                        var x = event.touches[0].clientX - startX
                        var y = event.touches[0].clientY - startY

                        // Prepare the data to be sent
                        var data = JSON.stringify({x: y, y: x});

                        // Create a new XMLHttpRequest object
                        var xhr = new XMLHttpRequest();

                        // Configure it: POST-request for the URL /log_coordinates
                        xhr.open('POST', '/scroll', true);
                        xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                        // Send the request with the data
                        xhr.send(data);
                    }
                });
            } else {
                image.addEventListener('click', function(event) {
                    event.preventDefault();
                    // var x = event.clientX/window.innerWidth;
                    // var y = event.clientY/window.innerHeight;
                    var rect = image.getBoundingClientRect();
                    var x = (event.clientX-rect.left)/image.offsetWidth;
                    var y = (event.clientY-rect.top)/image.offsetHeight;
                    var fixture = 0;

                    // Prepare the data to be sent
                    var data = JSON.stringify({ x: x+fixture, y: y+fixture});

                    // Create a new XMLHttpRequest object
                    var xhr = new XMLHttpRequest();

                    // Configure it: POST-request for the URL /log_coordinates
                    xhr.open('POST', '/click?act=left', true);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                    // Send the request with the data
                    xhr.send(data);
                });
                image.addEventListener('contextmenu', function(event) {
                    event.preventDefault();
                    // var x = event.clientX/window.innerWidth;
                    // var y = event.clientY/window.innerHeight;
                    var rect = image.getBoundingClientRect();
                    var x = (event.clientX-rect.left)/image.offsetWidth;
                    var y = (event.clientY-rect.top)/image.offsetHeight;
                    var fixture = 0;

                    // Prepare the data to be sent
                    var data = JSON.stringify({ x: x+fixture, y: y+fixture});

                    // Create a new XMLHttpRequest object
                    var xhr = new XMLHttpRequest();

                    // Configure it: POST-request for the URL /log_coordinates
                    xhr.open('POST', '/click?act=right', true);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                    // Send the request with the data
                    xhr.send(data);
                });
                image.addEventListener('wheel', function(event) {
                    event.preventDefault();
                    // var x = event.clientX/window.innerWidth;
                    // var y = event.clientY/window.innerHeight;
                    var rect = image.getBoundingClientRect();
                    var x = (event.clientX-rect.left)/image.offsetWidth;
                    var y = (event.clientY-rect.top)/image.offsetHeight;
                    var fixture = 0;

                    // Prepare the data to be sent
                    var data = JSON.stringify({ x: x+fixture, y: y+fixture});

                    // Create a new XMLHttpRequest object
                    var xhr = new XMLHttpRequest();

                    // Configure it: POST-request for the URL /log_coordinates
                    xhr.open('POST', '/scroll', true);
                    xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

                    // Send the request with the data
                    xhr.send(data);
                });
            }
        });
    </script>
</body>
</html>
